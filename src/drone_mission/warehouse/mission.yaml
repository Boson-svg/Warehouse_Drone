# Mission configuration
# Warehouse route example. Visual servo runs only when an explicit action is present.
mission:
  takeoff_altitude: 0.00
  actions:
    - type: "takeoff"
      altitude: 0.20

    - type: "move"
      frame: "world_body"
      position: [0.00, 0.00, 0.20]
      yaw: 0.00

    - type: "hover"
      duration: 1.00

    - type: "move"
      frame: "world_body"
      position: [0.00, 0.00, 0.20]
      yaw: 1.58

    - type: "hover"
      duration: 1.00
      
      ########################################
    - type: "move"
      frame: "world_body"
      position: [0.75, 0.00, 0.20]
      yaw: 1.58

    - type: "hover"
      duration: 2.00
      vision_hover: true
      
    - type: "move"
      frame: "world_body"
      position: [1.25, 0.00, 0.20]
      yaw: 1.58

    - type: "hover"
      duration: 2.00
      vision_hover: true
      
    - type: "move"
      frame: "world_body"
      position: [1.75, 0.00, 0.20]
      yaw: 1.58

    - type: "hover"
      duration: 2.00
      vision_hover: true
      ########################################
    - type: "move"
      frame: "world_body"
      position: [1.75, 0.00, 0.62]
      yaw: 1.58

    - type: "hover"
      duration: 2.00
      vision_hover: true
      
    - type: "move"
      frame: "world_body"
      position: [1.25, 0.00, 0.62]
      yaw: 1.58

    - type: "hover"
      duration: 2.00
      vision_hover: true
      
    - type: "move"
      frame: "world_body"
      position: [0.75, 0.00, 0.62]
      yaw: 1.58

    - type: "hover"
      duration: 2.00
      vision_hover: true
      ########################################
    - type: "move"
      frame: "world_body"
      position: [0.75, 0.00, 1.00]
      yaw: 1.58

    - type: "hover"
      duration: 2.00
      vision_hover: true
      
    - type: "move"
      frame: "world_body"
      position: [1.25, 0.00, 1.00]
      yaw: 1.58

    - type: "hover"
      duration: 2.00
      vision_hover: true
      
    - type: "move"
      frame: "world_body"
      position: [1.75, 0.00, 1.00]
      yaw: 1.58

    - type: "hover"
      duration: 2.00
      vision_hover: true
      ########################################
    - type: "move"
      frame: "world_body"
      position: [1.75, 0.00, 1.38]
      yaw: 1.58

    - type: "hover"
      duration: 2.00
      vision_hover: true
      
    - type: "move"
      frame: "world_body"
      position: [1.25, 0.00, 1.38]
      yaw: 1.58

    - type: "hover"
      duration: 2.00
      vision_hover: true
      
    - type: "move"
      frame: "world_body"
      position: [0.75, 0.00, 1.38]
      yaw: 1.58

    - type: "hover"
      duration: 2.00
      vision_hover: true
      ########################################
      
    - type: "move"
      frame: "world_body"
      position: [0.00, 0.00, 1.38]

    - type: "hover"
      duration: 1.00
      
    - type: "move"
      frame: "world_body"
      position: [0.00, 0.00, 1.38]
      yaw: 0.00

    - type: "hover"
      duration: 1.00
      
    - type: "move"
      frame: "world_body"
      position: [0.00, 0.00, 0.62]
      yaw: 0.00
      
    - type: "land"

system:
  # Global move-action defaults.
  tolerance: 0.10
  yaw_tolerance_deg: 4.0
  max_xy_speed_mps: 0.50
  max_z_speed_mps: 0.30
  max_yaw_rate_deg_s: 40.0

  # Global visual-servo defaults. They are used only by an explicit visual_servo action.
  target_id: ""
  require_confirmed: true
  image_x_axis: "y"
  image_y_axis: "z"
  image_x_sign: -1.0
  image_y_sign: -1.0
  kp_x: 0.35
  ki_x: 0.0
  kd_x: 0.02
  kp_y: 0.35
  ki_y: 0.0
  kd_y: 0.02
  integral_limit: 0.5
  filter_alpha: 0.35
  enter_tolerance_x: 0.04
  enter_tolerance_y: 0.04
  exit_tolerance_x: 0.07
  exit_tolerance_y: 0.07
  settle_time_s: 0.6
  acquire_timeout_s: 5.0
  lost_timeout_s: 1.0
  overall_timeout_s: 20.0
  max_body_speed_mps: 0.20
  continue_on_timeout: true
  auto_start_mission: false